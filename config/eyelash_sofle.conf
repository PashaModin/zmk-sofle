# Kconfig settings shared by BOTH halves of the keyboard.
#
# ZMK picks this file up because it matches the board directory name
# (boards/arm/eyelash_sofle). Settings that should apply to only one half go in
# eyelash_sofle_left.conf / eyelash_sofle_right.conf instead - ZMK applies every
# matching .conf file, so those add to this one rather than replacing it.
#
# Anything commented out below is off. To look up what a symbol does, search for
# it at https://zmk.dev/docs/config

# -----------------------------------------------------------------------------
# Power and sleep
# -----------------------------------------------------------------------------
# Deep sleep after one hour of inactivity (1 * 60 * 60 * 1000 ms). In deep sleep
# the displays switch off and the Bluetooth link drops until you press a key.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Software-controlled power rail for the underglow LEDs and displays.
CONFIG_ZMK_EXT_POWER=y

# Use the external 32 kHz crystal rather than the internal RC oscillator: more
# accurate Bluetooth timing and lower idle current.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# -----------------------------------------------------------------------------
# Key scanning
# -----------------------------------------------------------------------------
# Debounce windows in ms. Raise these if a single press ever registers twice;
# lower them if the keyboard feels laggy.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# -----------------------------------------------------------------------------
# Bluetooth and HID
# -----------------------------------------------------------------------------
# Maximum transmit power, for range and link stability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 6-key rollover instead of N-key rollover. NKRO is more capable but some BIOSes
# and older hosts do not accept it.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Restrict consumer (media) keys to the basic set - needed by some hosts that
# reject the full usage range.
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# -----------------------------------------------------------------------------
# Rotary encoder (left half) and mouse emulation
# -----------------------------------------------------------------------------
# EC11 encoder driver. What a turn does is set per layer by `sensor-bindings`
# in eyelash_sofle.keymap.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse pointer/scroll support, used by the &mmv and &mkp behaviours that the
# 5-way nav switch is bound to on layers 1 and 2.
CONFIG_ZMK_POINTING=y

# -----------------------------------------------------------------------------
# RGB underglow
# -----------------------------------------------------------------------------
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Start with the underglow off - turn it on with RGB_ON on layer 1.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Save battery: cut the underglow when the keyboard goes idle, and when it is
# running from battery rather than USB.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# -----------------------------------------------------------------------------
# Per-key backlight
# -----------------------------------------------------------------------------
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# -----------------------------------------------------------------------------
# Debugging
# -----------------------------------------------------------------------------
# Streams ZMK's log over the USB serial port. Useful for reading key positions
# and diagnosing the split link, but it costs real battery life - turn it back
# off when you are done. See docs/hardware.md.
#CONFIG_ZMK_USB_LOGGING=y
