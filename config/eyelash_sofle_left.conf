# Settings for the LEFT half only.
#
# ZMK applies this in addition to eyelash_sofle.conf, because it matches the
# specific board name rather than the board directory name. Every setting here
# concerns agentctl, which can only run on the central half.
#
# Delete this file to get an ordinary keyboard back: the right half is
# untouched by agentctl, and the left half falls back to the stock nice!view
# status screen.

# -----------------------------------------------------------------------------
# Raw HID transport
# -----------------------------------------------------------------------------
# Adds a second USB HID interface on usage page 0xFF60, usage 0x61, carrying
# 32-byte reports. This is what the soflectl daemon opens. ZMK restricts
# CONFIG_RAW_HID to the central half on its own.
CONFIG_RAW_HID=y
CONFIG_USB_HID_DEVICE_COUNT=2

# -----------------------------------------------------------------------------
# agentctl
# -----------------------------------------------------------------------------
CONFIG_AGENTCTL=y

# agentctl draws the whole screen, so the nice!view's own status widget has to
# stand down - ZMK permits only one zmk_display_status_screen().
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# -----------------------------------------------------------------------------
# Sleep
# -----------------------------------------------------------------------------
# Deep sleep switches the display off and drops the HID link, which is exactly
# what a status display must not do. This costs battery life; if that matters
# more than the display, set this back to y and accept that the daemon will see
# the keyboard disappear when idle.
CONFIG_ZMK_SLEEP=n
