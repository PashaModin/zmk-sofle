# West manifest — declares which external repositories the firmware build pulls in.
#
# Every `revision` here is pinned to an exact commit or tag. Do not change these
# to a floating branch like `main`: the GitHub Actions build fetches these repos
# fresh on every run, so a floating revision means an upstream commit can break
# your build on a day you changed nothing.
#
# To upgrade a dependency deliberately: change the revision below, push, and
# check the "Build ZMK firmware" action before flashing the result.

manifest:
  remotes:
    # ZMK firmware itself.
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware

    # Mario animation for the right-hand nice!view display.
    - name: gpeye
      url-base: https://github.com/GPeye

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: edf5c0814fd3ea202e43aad2d68fd32e882a518c # v0.3.0
      import: app/west.yml

    - name: mario-peripheral-animation
      remote: gpeye
      revision: 1aa3950d6c86b4240b3f79d06bdbb04c5d920711 # 2024-09-02, last commit

  self:
    # This repository is itself a ZMK module: it supplies the `eyelash_sofle`
    # board definition under boards/. See zephyr/module.yml.
    path: boards
