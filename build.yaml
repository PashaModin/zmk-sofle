---
# Firmware images built by GitHub Actions on every push.
#
# Each entry below produces one .uf2 file inside the "firmware" artifact of the
# "Build ZMK firmware" workflow run. See README.md -> "Build and flash".

include:
  # ---------------------------------------------------------------------------
  # Left half - the CENTRAL side.
  #
  # Owns the USB connection, the Bluetooth link to your computer, and the entire
  # keymap. Reflash this half whenever you change anything in config/.
  #
  # ZMK Studio is enabled so the keymap can also be edited live over USB at
  # https://zmk.studio - the studio-rpc-usb-uart snippet is what carries that.
  # ---------------------------------------------------------------------------
  - board: eyelash_sofle_left
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_left

  # ---------------------------------------------------------------------------
  # Right half - the PERIPHERAL side.
  #
  # Scans its own keys plus the 5-way nav switch and forwards them to the left
  # half over Bluetooth. It has no keymap of its own, so keymap edits do NOT
  # require reflashing it - only board or display changes do.
  #
  # nice_view_custom is the Mario animation shield, pulled in by config/west.yml.
  # ---------------------------------------------------------------------------
  - board: eyelash_sofle_right
    shield: nice_view_custom
    artifact-name: eyelash_sofle_right

  # ---------------------------------------------------------------------------
  # Recovery images.
  #
  # Flashing one of these wipes that half's stored settings: Bluetooth host
  # pairings, the pairing between the two halves, and saved RGB/backlight state.
  # Use them when the halves stop talking to each other - flash BOTH, then flash
  # the normal images above again. See README.md -> "Troubleshooting".
  # ---------------------------------------------------------------------------
  - board: eyelash_sofle_left
    shield: settings_reset
    artifact-name: eyelash_sofle_reset_left

  - board: eyelash_sofle_right
    shield: settings_reset
    artifact-name: eyelash_sofle_reset_right
